<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- GitHub Pages serves this file for any missing path, so assets resolve from the site root. Update if the site moves to a custom domain. -->
    <base href="/NEU_AISkunkworks_Website/" />
    <title>Page not found | AI Skunkworks at Northeastern</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#c8102e" />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("skunkworks-theme"); } catch (e) {}
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <style>
      .nf { position: relative; z-index: var(--z-content); min-height: 100vh; display: grid; place-items: center; padding: var(--space-xl) var(--space-md); text-align: center; }
      .nf__code { font-size: clamp(4rem, 14vw, 9rem); font-weight: 700; line-height: 1; color: var(--accent); margin: 0; }
      .nf__label { text-transform: uppercase; letter-spacing: 0.12em; font-size: var(--text-xs); color: var(--ink-dim); margin: var(--space-sm) 0; }
      .nf__body { max-width: 36rem; margin: 0 auto var(--space-lg); font-size: var(--text-base); }
      .nf__links { display: flex; flex-wrap: wrap; gap: var(--space-sm); justify-content: center; }
      .nf img { margin-left: auto; margin-right: auto; border-radius: 50%; margin-bottom: var(--space-md); }
    </style>
  </head>
  <body>
    <main class="nf" id="main">
      <div>
        <img src="assets/skunkworks-logo.jpg" alt="AI Skunkworks logo" width="96" height="96" />
        <p class="nf__label">File not found · Clearance not required</p>
        <h1 class="nf__code">404</h1>
        <p class="nf__body">
          This page went dark. It may have moved, or it never existed outside a whiteboard.
          Try one of the pages below.
        </p>
        <nav class="nf__links" aria-label="Site pages">
          <a class="btn btn--primary" href="./">Home</a>
          <a class="btn" href="projects.html">Projects</a>
          <a class="btn" href="events.html">Events</a>
          <a class="btn" href="people.html">Crew</a>
          <a class="btn" href="manifesto.html">Manifesto</a>
        </nav>
      </div>
    </main>
  </body>
</html>
